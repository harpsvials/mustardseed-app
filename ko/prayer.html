<script>/* ===== 语言字典（仅 ko） ===== */window.I18N = {"ko":{"title":"mustardseed · 기도의 벽","hero.title":"기도의 벽","hero.sub":"기도 제목을 여기에 올려주세요—예수 안에서 함께 지켜보겠습니다","pw.name.label":"이름","pw.name.placeholder":"어떻게 불러드릴까요?","pw.content.label":"기도 제목","pw.content.placeholder":"기도해 주셨으면 하는 것, 감사한 일을 적어주세요… (최대 500자)","pw.hint":"모든 기도 제목을 조용히 품겠습니다","pw.submit":"올리기","pw.sending":"올리는 중…","pw.loading":"기도 제목 불러오는 중…","pw.empty":"아직 기도가 없습니다. 첫 번째 기도 제목을 올려보세요","pw.count":"기도","pw.err.name":"이름을 입력해 주세요","pw.err.content":"기도 내용을 입력해 주세요","pw.err.send":"올리기에 실패했습니다. 잠시 후 다시 시도해 주세요","pw.err.load":"불러오기에 실패했습니다. 잠시 후 다시 시도해 주세요","pw.err.blocked":"기도에 부적절한 내용이 포함되어 있습니다. 수정 후 다시 시도해 주세요","pw.ok":"올렸습니다. 맡겨주셔서 감사합니다","pw.foot":"기도 제목은 공개됩니다. 개인정보는 입력하지 마세요","rd.voice.default":"시스템 기본","rd.voice.aria":"음성 전환","rd.rate":"속도","rd.pitch":"음정","rd.voice":"음성","rd.title":"소리내어 읽기","lang.label":"언어","nav.aria":"사이트 내비게이션","nav.home":"홈","nav.sermons":"설교","nav.discussion":"교제","nav.testimonies":"간증","nav.guestbook":"방명록","nav.prayer":"기도의 벽","nav.about":"소개","contact.label":"지원 및 협력","footer.tag":"모든 나눔이 씨앗처럼 흙에 떨어지기를","ms.play":"배경 음악 재생","ms.pause":"배경 음악 일시정지","gb.section":"방명록","gb.name.label":"이름","gb.name.placeholder":"어떻게 불러드릴까요?","gb.content.label":"메시지","gb.content.placeholder":"나눌 이야기를 적어주세요… (최대 500자)","gb.hint":"모든 나눔을 소중히 읽겠습니다","gb.submit":"보내기","gb.sending":"보내는 중…","gb.loading":"메시지 불러오는 중…","gb.empty":"아직 메시지가 없습니다. 첫 번째 나눔을 남겨보세요","gb.count":"메시지","gb.err.name":"이름을 입력해 주세요","gb.err.content":"메시지를 입력해 주세요","gb.err.send":"전송에 실패했습니다. 잠시 후 다시 시도해 주세요","gb.err.load":"불러오기에 실패했습니다. 잠시 후 다시 시도해 주세요","gb.err.blocked":"메시지에 부적절한 내용(음란/폭력/욕설/광고)이 포함되어 있습니다. 수정 후 다시 시도해 주세요","gb.ok":"메시지를 보냈습니다. 나눔에 감사드립니다","gb.foot":"메시지는 공개됩니다. 개인정보는 입력하지 마세요","q.tag":"묵상","chap.intro":"서론","ms.list":"음악 선택"}};</script>
<script>
/* 祷告墙逻辑：加载列表 + 发布祷告（D1 接口），切换语言自动刷新 */
(function(){
  var list = document.getElementById('pwList');
  var form = document.getElementById('pwForm');
  var nameEl = document.getElementById('pwName');
  var contentEl = document.getElementById('pwContent');
  var msg = document.getElementById('pwMsg');
  var submitBtn = form.querySelector('.gb-submit');
  function dict(){ return (window.I18N && window.__lang && window.I18N[window.__lang.get()]) || {}; }
  function showMsg(text, isErr){
    msg.textContent = text;
    msg.className = 'gb-msg' + (isErr ? ' err' : '');
    msg.style.display = 'block';
  }
  function fmtTime(t){
    var d = new Date(String(t).indexOf('Z') < 0 ? t + 'Z' : t);
    if (isNaN(d)) return String(t);
    function p(n){ return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function render(items){
    list.innerHTML = '';
    if (!items || !items.length) {
      var li = document.createElement('li');
      li.className = 'gb-empty';
      li.textContent = dict()['pw.empty'] || '还没有祷告，来写下第一份心愿吧';
      list.appendChild(li);
      return;
    }
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var li = document.createElement('li');
      li.className = 'gb-item';
      var top = document.createElement('div');
      top.className = 'gb-top';
      var nm = document.createElement('span');
      nm.className = 'gb-name';
      nm.textContent = it.name;
      var tm = document.createElement('span');
      tm.className = 'gb-time';
      tm.textContent = fmtTime(it.created_at);
      top.appendChild(nm); top.appendChild(tm);
      var ct = document.createElement('div');
      ct.className = 'gb-content';
      ct.textContent = it.content;
      li.appendChild(top); li.appendChild(ct);
      list.appendChild(li);
    }
  }
  function renderErr(){
    list.innerHTML = '';
    var li = document.createElement('li');
    li.className = 'gb-empty';
    li.textContent = dict()['pw.err.load'] || '祷告加载失败，请稍后再试';
    list.appendChild(li);
  }
  var state = { items: null, failed: false };
  function load(){
    state.failed = false;
    fetch('https://zhuzhouchurch.com/api/prayers', { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function(d){
        if (!d.ok) throw new Error('api');
        state.items = d.items || [];
        render(state.items);
      })
      .catch(function(){ state.failed = true; renderErr(); });
  }
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var D = dict();
    var name = nameEl.value.trim();
    var content = contentEl.value.trim();
    if (!name) { showMsg(D['pw.err.name'] || '请填写昵称', true); return; }
    if (!content) { showMsg(D['pw.err.content'] || '请填写祷告内容', true); return; }
    if (window.__hasBlocked && (window.__hasBlocked(name) || window.__hasBlocked(content))) {
      showMsg(D['pw.err.blocked'] || '祷告包含不当内容，请修改后重试', true);
      return;
    }
    showMsg(D['pw.sending'] || '发布中…', false);
    submitBtn.disabled = true;
    fetch('https://zhuzhouchurch.com/api/prayers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, content: content })
    })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.ok) {
          contentEl.value = '';
          showMsg(D['pw.ok'] || '祷告已发布，感谢你的托付', false);
          load();
        } else if (d.error === 'blocked') {
          showMsg(D['pw.err.blocked'] || '祷告包含不当内容，请修改后重试', true);
        } else {
          showMsg(D['pw.err.send'] || '发布失败，请稍后再试', true);
        }
        submitBtn.disabled = false;
      })
      .catch(function(){
        showMsg(D['pw.err.send'] || '发布失败，请稍后再试', true);
        submitBtn.disabled = false;
      });
  });
  window.__langHooks = window.__langHooks || [];
  window.__langHooks.push(function(cur, d){
    if (nameEl) nameEl.placeholder = d['pw.name.placeholder'] || nameEl.placeholder;
    if (contentEl) contentEl.placeholder = d['pw.content.placeholder'] || contentEl.placeholder;
    if (state.failed) renderErr();
    else if (state.items) render(state.items);
  });
  load();
})();
</script><script>window.RD_SEL = ['.hero-verse', '.gb-hint'];</script><script src="../src/shared.js"></script>
