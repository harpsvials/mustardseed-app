# mustardseed 网站 — Wrangler 配置
# 静态资源托管 + 留言系统（D1 数据库）
# 404 规则：访问不存在的路径时，自动显示根目录的 404.html

name = "mustardseed"
main = "src/index.js"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "mustardseed-comments"
database_id = "a73d7744-5c55-480b-a257-456f884cc3f8"

[[d1_databases]]
binding = "PRAYER_DB"
database_name = "mustardseed-prayers"
database_id = "bc917a54-3971-44e9-bc76-4bc5794db0d1"

[assets]
directory = "./"
not_found_handling = "404-page"
# 暴露 ASSETS 绑定：/api/data、/api/asset 需要它转发静态文件
# （App 走静态路径会被 Cloudflare 托管验证拦成 403，走 /api 才通）
binding = "ASSETS"

# 每日抓取的落点：Worker Cron 把当天的 qt-data.json / rpg-data.json 与图片写进 KV，
# /api/data、/api/asset 优先读这里；GitHub 仅作为兜底与仓库留档。
[[kv_namespaces]]
binding = "MUSTARDSEED_DATA"
id = "b92e503b9b294159a158a0be73144b8f"

# 北京时间 05:00–08:40 = UTC 21:00–00:40，每 20 分钟试一次；
# 另加 12:00 与 20:00（UTC 04:00 / 12:00）各复核一次，防对方站点当日晚些时候才更新。
# 抓到当天内容即写入，其余时点检测到没变化会自己跳过，不会重复覆盖。
[triggers]
crons = ["*/20 21-23,0 * * *", "0 4 * * *", "0 12 * * *"]
