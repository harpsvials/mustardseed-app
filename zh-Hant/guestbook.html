<script>/* ===== 语言字典（仅 zh-Hant） ===== */window.I18N = {"zh-Hant":{"title":"mustardseed · 留言板","hero.title":"留下你的分享","hero.sub":"一句話、一個故事，都可能成為別人的種子","gb.err.blocked":"留言包含不當內容（色情/暴力/辱罵），請修改後重試","rd.voice.default":"系統預設","rd.voice.aria":"切換語音","rd.rate":"語速","rd.pitch":"音調","rd.voice":"聲音","rd.title":"朗讀全文","lang.label":"語言","nav.aria":"站點導航","nav.home":"主頁","nav.sermons":"講道","nav.discussion":"討論","nav.testimonies":"見證","nav.guestbook":"留言","nav.prayer":"禱告牆","nav.about":"關於","contact.label":"支持與合作","footer.tag":"讓每個分享都像種子，落進土壤","ms.play":"播放背景音樂","ms.pause":"暫停背景音樂","gb.section":"留言板","gb.name.label":"暱稱","gb.name.placeholder":"怎麼稱呼你？","gb.content.label":"留言","gb.content.placeholder":"寫下你想分享的話…（最長 500 字）","gb.hint":"每一則分享都會被認真閱讀與珍藏","gb.submit":"發送留言","gb.sending":"發送中…","gb.loading":"留言載入中…","gb.empty":"還沒有留言，來做第一個分享的人吧","gb.count":"留言","gb.err.name":"請填寫暱稱","gb.err.content":"請填寫留言內容","gb.err.send":"發送失敗，請稍後再試","gb.err.load":"留言載入失敗，請稍後再試","gb.ok":"留言已送出，感謝你的分享","gb.foot":"留言會公開顯示，請勿填寫隱私資訊","q.tag":"思考 · Question","chap.intro":"引言","ms.list":"選擇音樂"}};</script>
<script>
/* 留言逻辑：加载列表 + 提交留言（D1 接口） */
(function(){
  var list = document.getElementById('gbList');
  var form = document.getElementById('gbForm');
  var nameEl = document.getElementById('gbName');
  var contentEl = document.getElementById('gbContent');
  var msg = document.getElementById('gbMsg');
  var submitBtn = form.querySelector('.gb-submit');

  function dict(){ return (window.I18N && window.__lang && window.I18N[window.__lang.get()]) || {}; }

  /* 留言来源页面标签（多语言映射） */
  var PAGE_TEXT = {
    'zh-CN': {home:'主页', discussion:'讨论', testimonies:'见证', guestbook:'留言板'},
    'zh-Hant': {home:'主頁', discussion:'討論', testimonies:'見證', guestbook:'留言板'},
    'en': {home:'Home', discussion:'Discussion', testimonies:'Testimony', guestbook:'Guestbook'},
    'fr': {home:'Accueil', discussion:'Discussion', testimonies:'Témoignage', guestbook:"Livre d'or"},
    'it': {home:'Home', discussion:'Discussione', testimonies:'Testimonianze', guestbook:'Guestbook'},
    'ja': {home:'ホーム', discussion:'ディスカッション', testimonies:'証し', guestbook:'掲示板'},
    'ko': {home:'홈', discussion:'토론', testimonies:'간증', guestbook:'방명록'}
  };
  function pageLabel(page){
    var lang = (window.__lang && window.__lang.get()) || 'zh-CN';
    var m = PAGE_TEXT[lang] || PAGE_TEXT['zh-CN'];
    return m[page] || page || m['guestbook'];
  }

  function showMsg(text, isErr){
    msg.textContent = text;
    msg.className = 'gb-msg' + (isErr ? ' err' : '');
    msg.style.display = 'block';
  }

  /* D1 存的 created_at 是 UTC，加 Z 转本地时间显示 */
  function fmtTime(t){
    var d = new Date(String(t).indexOf('Z') < 0 ? t + 'Z' : t);
    if (isNaN(d)) return String(t);
    function p(n){ return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function render(items){
    list.innerHTML = '';
    if (!items || !items.length) {
      var li = document.createElement('li');
      li.className = 'gb-empty';
      li.textContent = dict()['gb.empty'] || '还没有留言，来做第一个分享的人吧';
      list.appendChild(li);
      return;
    }
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var li = document.createElement('li');
      li.className = 'gb-item';
      var top = document.createElement('div');
      top.className = 'gb-top';
      var nm = document.createElement('span');
      nm.className = 'gb-name';
      nm.textContent = it.name;
      var pg = document.createElement('span');
      pg.className = 'gb-page';
      pg.textContent = pageLabel(it.page);
      var tm = document.createElement('span');
      tm.className = 'gb-time';
      tm.textContent = fmtTime(it.created_at);
      top.appendChild(nm); top.appendChild(pg); top.appendChild(tm);
      var ct = document.createElement('div');
      ct.className = 'gb-content';
      ct.textContent = it.content;   /* textContent 渲染，天然防 XSS */
      li.appendChild(top); li.appendChild(ct);
      list.appendChild(li);
    }
  }

  function renderErr(){
    list.innerHTML = '';
    var li = document.createElement('li');
    li.className = 'gb-empty';
    li.textContent = dict()['gb.err.load'] || '留言加载失败，请稍后再试';
    list.appendChild(li);
  }

  /* 记录当前加载状态，语言切换时按新字典重渲染 */
  var state = { items: null, failed: false };

  function load(){
    state.failed = false;
    fetch('https://zhuzhouchurch.com/api/comments', { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function(d){
        if (!d.ok) throw new Error('api');
        state.items = d.items || [];
        render(state.items);
      })
      .catch(function(){
        state.failed = true;
        renderErr();
      });
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var D = dict();
    var name = nameEl.value.trim();
    var content = contentEl.value.trim();
    if (!name) { showMsg(D['gb.err.name'] || '请填写昵称', true); return; }
    if (!content) { showMsg(D['gb.err.content'] || '请填写留言内容', true); return; }
    if (window.__hasBlocked && (window.__hasBlocked(name) || window.__hasBlocked(content))) {
      showMsg(D['gb.err.blocked'] || '留言包含不当内容，请修改后重试', true);
      return;
    }
    showMsg(D['gb.sending'] || '发送中…', false);
    submitBtn.disabled = true;
    fetch('https://zhuzhouchurch.com/api/comments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, content: content, page: 'guestbook' })
    })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.ok) {
          contentEl.value = '';
          showMsg(D['gb.ok'] || '留言已发出，感谢你的分享', false);
          load();
        } else if (d.error === 'blocked') {
          showMsg(D['gb.err.blocked'] || '留言包含不当内容，请修改后重试', true);
        } else {
          showMsg(D['gb.err.send'] || '发送失败，请稍后再试', true);
        }
        submitBtn.disabled = false;
      })
      .catch(function(){
        showMsg(D['gb.err.send'] || '发送失败，请稍后再试', true);
        submitBtn.disabled = false;
      });
  });

  /* 语言切换：placeholder + 列表文本按新语言重渲染
     （shared.js 不处理 placeholder；此钩子须在 shared.js 之前注册，
       且 shared.js 已改为保留页面预注册的钩子） */
  window.__langHooks = window.__langHooks || [];
  window.__langHooks.push(function(cur, d){
    if (nameEl) nameEl.placeholder = d['gb.name.placeholder'] || nameEl.placeholder;
    if (contentEl) contentEl.placeholder = d['gb.content.placeholder'] || contentEl.placeholder;
    if (state.failed) renderErr();
    else if (state.items) render(state.items);
  });

  load();
})();
</script>
<script src="../src/shared.js"></script>
