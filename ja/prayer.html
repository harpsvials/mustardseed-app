<script>/* ===== 语言字典（仅 ja） ===== */window.I18N = {"ja":{"title":"mustardseed · 祈りの壁","hero.title":"祈りの壁","hero.sub":"願いをここに置いてください—一緒にイエスにあって見守ります","pw.name.label":"お名前","pw.name.placeholder":"何と呼びましょうか？","pw.content.label":"祈りのリクエスト","pw.content.placeholder":"祈ってほしいこと、感謝したいことを書いてください…（最大500文字）","pw.hint":"すべての願いを静かに祈りの中で支えます","pw.submit":"投稿する","pw.sending":"投稿中…","pw.loading":"祈りを読み込み中…","pw.empty":"まだ祈りがありません。最初の願いを書いてみましょう","pw.count":"祈り","pw.err.name":"お名前を入力してください","pw.err.content":"祈りの内容を入力してください","pw.err.send":"投稿に失敗しました。後でもう一度お試しください","pw.err.load":"読み込みに失敗しました。後でもう一度お試しください","pw.err.blocked":"祈りに不適切な内容が含まれています。修正してもう一度お試しください","pw.ok":"投稿しました。お委ねいただきありがとうございます","pw.foot":"祈りは公開されます。個人情報はご記入をお控えください","ms.play":"背景音楽を再生","ms.pause":"背景音楽を一時停止","lang.label":"言語","nav.aria":"サイトナビゲーション","nav.home":"ホーム","nav.sermons":"説教","nav.discussion":"交流","nav.testimonies":"証し","nav.guestbook":"ゲストブック","nav.prayer":"祈りの壁","nav.about":"私たちについて","contact.label":"支援・協力","footer.tag":"すべての分かち合いが、種のように土に落ちますように","gb.section":"ゲストブック","gb.name.label":"お名前","gb.name.placeholder":"何と呼びましょうか？","gb.content.label":"メッセージ","gb.content.placeholder":"あなたの思いを書いてください…（最大500文字）","gb.hint":"すべての分かち合いを大切に読みます","gb.submit":"送信","gb.sending":"送信中…","gb.loading":"メッセージを読み込み中…","gb.empty":"まだメッセージがありません。最初の分かち合いをどうぞ","gb.count":"メッセージ","gb.err.name":"お名前を入力してください","gb.err.content":"メッセージを入力してください","gb.err.send":"送信に失敗しました。後でもう一度お試しください","gb.err.load":"読み込みに失敗しました。後でもう一度お試しください","gb.err.blocked":"メッセージに不適切な内容（ポルノ/暴力/誹謗中傷/広告）が含まれています。修正してもう一度お試しください","gb.ok":"送信しました。分かち合いに感謝します","gb.foot":"メッセージは公開されます。個人情報はご記入をお控えください","q.tag":"考えてみましょう","chap.intro":"序論","ms.list":"音楽を選択"}};</script>
<script>
/* 祷告墙逻辑：加载列表 + 发布祷告（D1 接口），切换语言自动刷新 */
(function(){
  var list = document.getElementById('pwList');
  var form = document.getElementById('pwForm');
  var nameEl = document.getElementById('pwName');
  var contentEl = document.getElementById('pwContent');
  var msg = document.getElementById('pwMsg');
  var submitBtn = form.querySelector('.gb-submit');
  function dict(){ return (window.I18N && window.__lang && window.I18N[window.__lang.get()]) || {}; }
  function showMsg(text, isErr){
    msg.textContent = text;
    msg.className = 'gb-msg' + (isErr ? ' err' : '');
    msg.style.display = 'block';
  }
  function fmtTime(t){
    var d = new Date(String(t).indexOf('Z') < 0 ? t + 'Z' : t);
    if (isNaN(d)) return String(t);
    function p(n){ return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function render(items){
    list.innerHTML = '';
    if (!items || !items.length) {
      var li = document.createElement('li');
      li.className = 'gb-empty';
      li.textContent = dict()['pw.empty'] || '还没有祷告，来写下第一份心愿吧';
      list.appendChild(li);
      return;
    }
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var li = document.createElement('li');
      li.className = 'gb-item';
      var top = document.createElement('div');
      top.className = 'gb-top';
      var nm = document.createElement('span');
      nm.className = 'gb-name';
      nm.textContent = it.name;
      var tm = document.createElement('span');
      tm.className = 'gb-time';
      tm.textContent = fmtTime(it.created_at);
      top.appendChild(nm); top.appendChild(tm);
      var ct = document.createElement('div');
      ct.className = 'gb-content';
      ct.textContent = it.content;
      li.appendChild(top); li.appendChild(ct);
      list.appendChild(li);
    }
  }
  function renderErr(){
    list.innerHTML = '';
    var li = document.createElement('li');
    li.className = 'gb-empty';
    li.textContent = dict()['pw.err.load'] || '祷告加载失败，请稍后再试';
    list.appendChild(li);
  }
  var state = { items: null, failed: false };
  function load(){
    state.failed = false;
    fetch('https://zhuzhouchurch.com/api/prayers', { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function(d){
        if (!d.ok) throw new Error('api');
        state.items = d.items || [];
        render(state.items);
      })
      .catch(function(){ state.failed = true; renderErr(); });
  }
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var D = dict();
    var name = nameEl.value.trim();
    var content = contentEl.value.trim();
    if (!name) { showMsg(D['pw.err.name'] || '请填写昵称', true); return; }
    if (!content) { showMsg(D['pw.err.content'] || '请填写祷告内容', true); return; }
    if (window.__hasBlocked && (window.__hasBlocked(name) || window.__hasBlocked(content))) {
      showMsg(D['pw.err.blocked'] || '祷告包含不当内容，请修改后重试', true);
      return;
    }
    showMsg(D['pw.sending'] || '发布中…', false);
    submitBtn.disabled = true;
    fetch('https://zhuzhouchurch.com/api/prayers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, content: content })
    })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.ok) {
          contentEl.value = '';
          showMsg(D['pw.ok'] || '祷告已发布，感谢你的托付', false);
          load();
        } else if (d.error === 'blocked') {
          showMsg(D['pw.err.blocked'] || '祷告包含不当内容，请修改后重试', true);
        } else {
          showMsg(D['pw.err.send'] || '发布失败，请稍后再试', true);
        }
        submitBtn.disabled = false;
      })
      .catch(function(){
        showMsg(D['pw.err.send'] || '发布失败，请稍后再试', true);
        submitBtn.disabled = false;
      });
  });
  window.__langHooks = window.__langHooks || [];
  window.__langHooks.push(function(cur, d){
    if (nameEl) nameEl.placeholder = d['pw.name.placeholder'] || nameEl.placeholder;
    if (contentEl) contentEl.placeholder = d['pw.content.placeholder'] || contentEl.placeholder;
    if (state.failed) renderErr();
    else if (state.items) render(state.items);
  });
  load();
})();
</script><script src="../src/shared.js"></script>
