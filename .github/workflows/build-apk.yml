name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Sync website to Android assets
        run: |
          rsync -a --delete ./ android/app/src/main/assets/public/ \
            --exclude 'android/' --exclude 'android_old/' \
            --exclude '.git/' --exclude '.github/' --exclude 'node_modules/' \
            --exclude '.DS_Store' --exclude '_backup/' --exclude '_shots/' \
            --exclude '*.jks' --exclude 'package.json' --exclude 'package-lock.json' \
            --exclude 'push-indexnow.py' --exclude '.assetsignore' --exclude '.gitignore' \
            --exclude 'indexnow-*.txt'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-key.jks

      - name: Set version (time-based)
        id: ver
        run: |
          echo "vcode=$(date +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "vname=v$(date +%Y.%m.%d)" >> $GITHUB_OUTPUT

      - name: Build release APK & AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -PVERSION_CODE=${{ steps.ver.outputs.vcode }} \
            -PVERSION_NAME=${{ steps.ver.outputs.vname }} \
            -PRELEASE_STORE_FILE=$GITHUB_WORKSPACE/release-key.jks \
            -PRELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" 2>&1 | tee gradle.log
          exit ${PIPESTATUS[0]}

      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: android/gradle.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mustardseed-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: mustardseed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          tag_name: ${{ steps.ver.outputs.vname }}
          name: 芥菜种教会 ${{ steps.ver.outputs.vname }}
          body: |
            自动打包的安卓安装包（Release 签名版）
            - 版本号：${{ steps.ver.outputs.vname }}（时间版本号）
            - APK：直接安装使用（GitHub 直链 / 平板安装）
            - AAB：Google Play 商店上架专用格式
            - 包名：com.zhuzhouchurch.app
            - 内置完整多语言网站，支持离线浏览
          generate_release_notes: true
