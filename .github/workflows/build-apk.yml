name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode signing keystore
        run: |
          mkdir -p app/android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/android/app/release-key.jks
          cat > app/android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-key.jks
          EOF

      - name: Set version (time-based)
        id: ver
        run: |
          echo "vcode=$(date +%s)" >> $GITHUB_OUTPUT
          echo "vname=v$(TZ=Asia/Shanghai date +%Y.%m.%d.%H%M)" >> $GITHUB_OUTPUT

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --build-name ${{ steps.ver.outputs.vname }} --build-number ${{ steps.ver.outputs.vcode }}

      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: app/build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mustardseed-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
          tag_name: ${{ steps.ver.outputs.vname }}
          name: 芥菜种教会 ${{ steps.ver.outputs.vname }}
          body: |
            Flutter 版安卓安装包（Release 签名版）
            - 版本号：${{ steps.ver.outputs.vname }}（时间版本号）
            - 本次更新：${{ github.event.head_commit.message }}
            - APK：直接安装使用（GitHub 直链 / 平板安装）
            - 包名：com.zhuzhouchurch.mustardseed_app
            - 内置完整多语言网站，支持离线浏览
          generate_release_notes: true
