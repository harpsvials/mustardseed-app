name: QT Daily Snapshot

# 台湾时间每天两次抓取《活泼的生命》当日页，只更新 qt-data.json。
# 05:30 / 08:30（台北）= 21:30 / 00:30（UTC）；第二趟用于兜底对方延迟更新。
on:
  schedule:
    - cron: '30 21 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:

concurrency:
  group: qt-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenCC
        run: pip install --quiet opencc-python-reimplemented

      - name: Fetch and parse today's fields
        run: python3 tools/qt_snapshot.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain qt-data.json)" ]; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git config user.name "qt-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add qt-data.json
          # [skip ci] 避免触发 Build App 工作流
          git commit -m "chore(qt): 更新今日灵修快照 $(TZ=Asia/Shanghai date +%F) [skip ci]"
          git push
