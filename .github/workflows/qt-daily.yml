name: QT Daily Snapshot

# 北京时间每天四次尝试抓取《活泼的生命》当日页，只更新 qt-data.json。
# 05:30 / 06:30 / 07:30 / 08:30（北京）= 21:30 / 22:30 / 23:30 / 00:30（UTC）
# GitHub 的 schedule 偶尔会被整次跳过（11-10 就漏了 21:30 那次），多排几次兜底。
# 脚本自身幂等：对方站点没换当天内容就不写入，内容没变就不产生提交。
on:
  schedule:
    - cron: '30 21 * * *'
    - cron: '30 22 * * *'
    - cron: '30 23 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:

concurrency:
  group: qt-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenCC
        run: pip install --quiet opencc-python-reimplemented

      - name: Fetch and parse today's fields
        run: python3 tools/qt_snapshot.py

      - name: Fetch RPG daily verse image (keep last 7 days)
        run: python3 tools/rpg_daily.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain qt-data.json rpg-data.json images/rpg)" ]; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git config user.name "qt-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add qt-data.json rpg-data.json
          if [ -d images/rpg ]; then git add images/rpg; fi
          # [skip ci] 避免触发 Build App 工作流
          git commit -m "chore(qt): 更新今日灵修与 RPG 每日经文 $(TZ=Asia/Shanghai date +%F) [skip ci]"
          git push
