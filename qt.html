/* ===== 灵修页：纸卡 + 两枚贴纸（本页专属，颜色不随主题变量漂移） ===== */
.page-qt{
  --qt-paper:#F3EBD8;
  --qt-ink:#22301C;
  --qt-ink-soft:rgba(34,48,28,.68);
  --qt-ink-faint:rgba(34,48,28,.44);
  --qt-gold:#E0AE33;
  --qt-gold-deep:#9C7420;
  --qt-terra:#8A4B1F;
  --qt-tape:#1D3526;
  --qt-tape-ink:#F3EBD8;
  /* 撕开的胶带两端 */
  --qt-torn:polygon(0% 0%,100% 0%,100% 9%,98.6% 13%,100% 17%,98.4% 22%,100% 27%,98.6% 32%,100% 37%,98.4% 43%,100% 48%,98.6% 54%,100% 59%,98.4% 65%,100% 70%,98.6% 76%,100% 81%,98.4% 87%,100% 92%,100% 100%,0% 100%,0% 92%,1.4% 87%,0% 81%,1.6% 76%,0% 70%,1.4% 65%,0% 59%,1.6% 54%,0% 48%,1.4% 43%,0% 37%,1.6% 32%,0% 27%,1.4% 22%,0% 17%,1.6% 13%,0% 9%);
}
html[data-theme="light"] .page-qt{--qt-paper:#FFFDF7;}

.qt-wrap{margin-top:clamp(16px,4vw,26px)}

.qt-sheet{
  position:relative;
  background:var(--qt-paper);
  color:var(--qt-ink);
  border-radius:4px;
  padding:clamp(26px,6vw,40px) clamp(20px,5.5vw,36px) clamp(22px,4.5vw,30px);
  box-shadow:0 22px 50px rgba(0,0,0,.38);
}
html[data-theme="light"] .qt-sheet{
  border:1px solid rgba(176,138,42,.22);
  box-shadow:0 18px 40px rgba(84,62,24,.16);
}
/* 贴在纸卡顶部的胶带 */
.qt-sheet::before{
  content:"";position:absolute;top:-13px;left:50%;width:100px;height:28px;z-index:2;
  transform:translateX(-50%) rotate(-2.2deg);
  background:rgba(224,174,51,.88);
  clip-path:var(--qt-torn);
  filter:drop-shadow(0 6px 9px rgba(0,0,0,.26));
}

.qt-head{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 14px;margin-bottom:clamp(16px,4.5vw,24px)}
.qt-kicker{font-family:var(--font-serif);font-weight:600;font-size:13px;letter-spacing:.24em;color:var(--qt-gold-deep)}
.qt-day{font-size:12.5px;color:var(--qt-ink-faint);font-variant-numeric:tabular-nums}

.qt-stale{position:relative;z-index:1;margin:0 0 16px;padding:10px 13px;border-radius:8px;background:rgba(217,142,90,.16);border:1px solid rgba(217,142,90,.45);font-size:13.5px;line-height:1.8;color:var(--qt-terra)}
.qt-stale b{font-weight:600}

.qt-sticker{position:relative;z-index:1}

/* 主题贴纸：金棕底、白边、略微歪 */
.qt-topic{
  background:var(--qt-gold);
  color:var(--qt-ink);
  padding:clamp(22px,6vw,34px) clamp(20px,5.5vw,34px) clamp(15px,4vw,20px);
  border-radius:20px 44px 18px 36px / 34px 18px 40px 22px;
  transform:rotate(-1.3deg);
  box-shadow:0 0 0 5px rgba(255,255,255,.94),0 18px 26px -8px rgba(0,0,0,.45);
  animation:qtTopicIn .62s var(--ease-out) both;
}
.qt-tag{display:inline-block;font-size:12px;letter-spacing:.24em}
.qt-topic .qt-tag{color:rgba(34,48,28,.55)}
.qt-topic h2{
  margin:11px 0 0;
  font-family:"Kaiti SC","STKaiti","KaiTi",var(--font-serif);
  font-weight:700;
  font-size:clamp(31px,9.2vw,44px);
  line-height:1.26;
  letter-spacing:.02em;
  overflow-wrap:break-word;
}
.qt-topic .qt-sub{margin:8px 0 0;font-family:var(--font-serif);font-weight:600;font-size:clamp(16px,4.5vw,20px);line-height:1.55;letter-spacing:.03em;color:var(--qt-terra)}
.qt-topic .qt-sub[hidden]{display:none}
.qt-stamp{margin-top:clamp(14px,4vw,20px);padding-top:10px;border-top:1px dashed rgba(34,48,28,.34);display:flex;align-items:center;gap:9px;font-size:13px;font-variant-numeric:tabular-nums}
.qt-topic .qt-stamp{color:rgba(34,48,28,.76)}
.qt-stamp i,.qt-stamp .qt-dot{display:block;width:3px;height:3px;border-radius:50%;font-style:normal;flex:none}
.qt-topic .qt-dot{background:rgba(34,48,28,.42)}

/* 经文范围：深绿胶带式横贴，撕口在两端 */
.qt-reading{
  margin-top:clamp(24px,6.5vw,36px);
  background:var(--qt-tape);
  color:var(--qt-tape-ink);
  padding:clamp(15px,4.2vw,21px) clamp(24px,7vw,44px);
  clip-path:var(--qt-torn);
  filter:drop-shadow(0 14px 18px rgba(0,0,0,.34));
  transform:rotate(.9deg);
  animation:qtTapeIn .62s .1s var(--ease-out) both;
}
.qt-reading .qt-tag{color:rgba(243,235,216,.56)}
.qt-range{margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.qt-book{font-family:var(--font-serif);font-weight:700;font-size:clamp(19px,5vw,24px);line-height:1.5;letter-spacing:.03em;color:var(--qt-tape-ink)}
.qt-num{font-family:var(--font-serif);font-weight:600;font-size:clamp(21px,5.8vw,28px);line-height:1.4;letter-spacing:.04em;color:var(--qt-gold);font-variant-numeric:tabular-nums;overflow-wrap:break-word}
.qt-reading .qt-stamp{color:rgba(243,235,216,.58);font-size:12.5px;margin-top:6px;border-top:0;padding-top:0}
.qt-reading .qt-dot{background:rgba(243,235,216,.42)}

.qt-meta{
  position:relative;z-index:1;
  margin:clamp(22px,5.5vw,32px) 0 0;
  padding-top:13px;
  border-top:1px solid rgba(34,48,28,.16);
  display:flex;flex-wrap:wrap;gap:4px 10px;
  font-size:12.5px;line-height:1.9;color:var(--qt-ink-soft);
}
.qt-meta a{color:var(--qt-terra);text-decoration:underline;text-underline-offset:3px}
.qt-meta a:hover{color:var(--qt-ink)}
.qt-meta .qt-sep{color:var(--qt-ink-faint)}

@keyframes qtTopicIn{
  from{opacity:0;transform:rotate(-1.3deg) translateY(14px) scale(.986)}
  to{opacity:1;transform:rotate(-1.3deg)}
}
@keyframes qtTapeIn{
  from{opacity:0;transform:rotate(.9deg) translateY(14px) scale(.986)}
  to{opacity:1;transform:rotate(.9deg)}
}
@media (min-width:720px){
  .qt-topic{padding:38px 40px 22px}
  .qt-reading{padding:20px 48px}
  .qt-topic h2{font-size:46px}
  .qt-num{font-size:29px}
}
@media (prefers-reduced-motion:reduce){
  .qt-topic,.qt-reading{animation:none}
}
</style>

<script>
(function(){
  /* 本页目前只有简体版本：其余语言入口改跳该语言主页，避免 404 */
  var bar = document.getElementById('langBar');
  if(bar){
    var other = bar.querySelectorAll('.lang-btn[data-lang]');
    for(var i=0;i<other.length;i++){
      var lang = other[i].getAttribute('data-lang');
      if(lang === 'zh-CN') continue;
      other[i].setAttribute('href', lang + '/index.html');
      other[i].setAttribute('title', '该语言暂无本页，前往' + other[i].textContent);
    }
  }

  var boot = {};
  try{ boot = JSON.parse(document.getElementById('qt-boot').textContent); }catch(e){}
  var data = boot;

  function splitReading(text){
    var m = String(text || '').match(/^([^\d０-９]+)(.*)$/);
    if(!m) return ['', String(text || '')];
    return [m[1].replace(/\s+/g,'').trim(), m[2].trim()];
  }
  function setText(id, value){
    var el = document.getElementById(id);
    if(el && value) el.textContent = value;
  }
  function render(d){
    setText('qtTopic', d.topic);
    var sub = document.getElementById('qtSubtitle');
    if(sub){ sub.textContent = d.subtitle || ''; sub.hidden = !d.subtitle; }

    var parts = splitReading(d.reading);
    setText('qtBook', parts[0] || d.reading);
    var numEl = document.getElementById('qtNum');
    if(numEl) numEl.textContent = parts[1] || '';

    setText('headDate', [d.dateLabel, d.weekday].filter(Boolean).join(' · '));
    setText('dateA', d.dateLabel); setText('weekA', d.weekday);
    setText('dateB', d.dateLabel); setText('weekB', d.weekday);
    setText('updated', d.updatedLabel ? '资料更新于 ' + d.updatedLabel + '（台北时间）' : '');

    var today = '';
    try{
      today = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Taipei'}).format(new Date());
    }catch(e){}
    var note = document.getElementById('staleNote');
    if(note){
      if(today && d.date && d.date !== today){ setText('staleDate', d.dateLabel); note.hidden = false; }
      else { note.hidden = true; }
    }
  }

  render(data);

  try{
    fetch('qt-data.json', {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if(j && j.topic){ data = Object.assign({}, data, j); render(data); } })
      .catch(function(){});
  }catch(e){}
})();
</script>
